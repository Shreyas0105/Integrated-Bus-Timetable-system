<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Integrated Bus Time Table System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Bus-TimeTable-System</h1>

    <div class="form-container">
        <h2>Add Bus Schedule</h2>
        <form id="busForm">
            <label>Bus Number</label>
            <input type="text" id="bus_no" required>

            <label>Source</label>
            <input type="text" id="source" required>

            <label>Destination</label>
            <input type="text" id="destination" required>

            <label>Departure Time</label>
            <input type="time" id="departure" required>

            <label>Arrival Time</label>
            <input type="time" id="arrival" required>

            <button type="submit">Save Schedule</button>
        </form>
    </div>

    <div class="table-container">
        <h2>Bus Time Table</h2>
        <table>
            <thead>
                <tr>
                    <th>Bus No</th>
                    <th>Source</th>
                    <th>Destination</th>
                    <th>Departure</th>
                    <th>Arrival</th>
                </tr>
            </thead>
            <tbody id="scheduleTable"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
